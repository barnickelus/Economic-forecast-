name: Market Turn-Up Scan

# On-demand market scanner (workflow_dispatch only — not part of the forecast
# program's scored instruments). Prints the screen to the run log and commits
# data/scan-latest.json.

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: market-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run scan
        run: node scripts/scan-turnups.js

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scan-latest.json
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "scan: $(date -u +%Y-%m-%dT%H:%MZ) market turn-up screen"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi
