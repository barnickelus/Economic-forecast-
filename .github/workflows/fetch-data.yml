name: Fetch Market Data

# This workflow runs the data fetcher on a schedule and commits
# fresh data files back to the repo. The dashboard reads them from
# the same origin (no CORS issues).

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'scripts/fetch-data.js'
      - '.github/workflows/fetch-data.yml'
      - 'data/tickers.json'

permissions:
  contents: write

# without this, a dispatched run and a push-triggered run race each other and
# the loser's push is rejected (seen live 2026-08-03: both committed, one failed)
concurrency:
  group: fetch-data
  cancel-in-progress: false

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch live data
        run: node scripts/fetch-data.js

      - name: Commit data if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --staged --quiet; then
            echo "no changes — skipping commit"
          else
            COUNT=$(jq -r '.tickers | length' data/index.json 2>/dev/null || echo "?")
            git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ) — $COUNT tickers"
            # rebase in case anything landed on the branch while we fetched
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi
