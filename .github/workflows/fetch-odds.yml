name: Log Catalyst Odds

# Runs twice daily (morning + evening UTC) so one failure doesn't lose the day.
# Appends one row per contract per day to data/catalyst-log.json — this file
# IS the backtest dataset for prediction-market -> oil -> silver lead/lag.

on:
  schedule:
    - cron: '10 13 * * *'
    - cron: '10 21 * * *'
  workflow_dispatch: {}
  push:
    paths:
      - 'scripts/fetch-odds.js'
      - '.github/workflows/fetch-odds.yml'
      - 'data/odds-topics.json'

permissions:
  contents: write

concurrency:
  group: fetch-odds
  cancel-in-progress: false

jobs:
  log-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and log odds
        run: node scripts/fetch-odds.js

      - name: Commit log if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalyst-log.json data/catalyst-latest.json data/odds-topics.json
          if git diff --staged --quiet; then
            echo "no changes — skipping commit"
          else
            git pull --rebase origin main || true
            git commit -m "odds: $(date -u +%Y-%m-%d) catalyst log"
            git push
          fi
