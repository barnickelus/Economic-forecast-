name: Log Catalyst Odds

# Runs twice daily (morning + evening UTC) so one failure doesn't lose the day.
# Appends one row per contract per day to data/catalyst-log.json — this file
# IS the backtest dataset for prediction-market -> oil -> silver lead/lag.

on:
  schedule:
    - cron: '10 13 * * *'
    - cron: '10 21 * * *'
  workflow_dispatch: {}
  push:
    paths:
      - 'scripts/fetch-odds.js'
      - 'scripts/auto-tilt.js'
      - 'scripts/engine.js'
      - 'scripts/score-tilt.js'
      - '.github/workflows/fetch-odds.yml'
      - 'data/odds-topics.json'

permissions:
  contents: write
  issues: write   # watchdog opens an issue when the pipeline fails silently

concurrency:
  group: fetch-odds
  cancel-in-progress: false

jobs:
  log-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and log odds
        run: node scripts/fetch-odds.js

      - name: Auto-log the engine's daily verdict (incl. abstains)
        run: node scripts/auto-tilt.js

      - name: Score tilt log from committed OHLC
        run: node scripts/score-tilt.js

      - name: Run pre-registered referees (print-only until maturity)
        run: |
          node scripts/referee-discriminator.js
          node scripts/referee-kalshi.js
          node scripts/referee-flags.js

      - name: Watchdog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/watchdog.js | tee /tmp/watchdog.out
          if grep -q WATCHDOG_ALERT /tmp/watchdog.out; then
            if [ -z "$(gh issue list --state open --search 'WATCHDOG in:title' --json number --jq '.[].number')" ]; then
              gh issue create --title "WATCHDOG: pipeline alert $(date -u +%Y-%m-%d)" --body "$(grep WATCHDOG_ALERT /tmp/watchdog.out). Opened automatically by the fetch-odds watchdog; close after fixing — it reopens if the condition persists."
            else
              echo "open WATCHDOG issue already exists — not duplicating"
            fi
          fi

      - name: Commit log if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalyst-log.json data/catalyst-latest.json data/odds-topics.json data/kalshi-log.json data/tilt-log.json data/physical-log.json
          git add data/shadow-v14.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "no changes — skipping commit"
          else
            git commit -m "odds: $(date -u +%Y-%m-%d) catalyst log"
            # commit FIRST, then rebase onto the branch we're on — pulling with a
            # dirty index fails, and hardcoding main rebased the wrong branch
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi
